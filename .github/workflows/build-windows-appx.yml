name: Build Windows portable (release)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}

jobs:
  build-windows-portable:
    runs-on: windows-latest
    name: Build Windows portable
    steps:
      # Preperation
      - uses: actions/checkout@v6
        with:
          show-progress: false
          persist-credentials: false
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          # Disable cache for release builds.
          # This makes <https://docs.zizmor.sh/audits/#cache-poisoning> happy.
          package-manager-cache: false
          node-version: 22.x
      - name: set version ref
        shell: bash
        run: |
          VERSION=$(jq -r .version package.json)
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "VERSION_INFO_GIT_REF=v${VERSION}" >> "$GITHUB_ENV"
      # Building JS
      - name: pnpm install, build
        run: |
          npm i -g pnpm
          pnpm install --frozen-lockfile
          cd packages/target-electron
          pnpm build
          pnpm run pack:generate_config
          pnpm run pack:patch-node-modules
      # Packaging and processing
      - name: WINDOWS electron builder
        env:
          NODE_ENV: production
        run: |
          cd packages/target-electron
          set DEBUG=electron-builder
          pnpm electron-builder --win portable --config.artifactName="deltachat-desktop.$env:VERSION.portable.exe"
      - name: WINDOWS renaming / upload Preperation
        working-directory: packages/target-electron/dist
        run: |
          dir
          mkdir preview
          move "deltachat-desktop.$env:VERSION.portable.exe" preview/
          dir preview
          cd ..
      # Upload Step
      - name: Upload result to artifacts
        uses: actions/upload-artifact@main
        with:
          name: windows portable release
          path: packages/target-electron/dist/preview/
